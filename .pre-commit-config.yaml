repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
      - id: terraform_checkov
        args:
          - --args=--quiet
          - --args=--skip-path=venv
          - --args=--skip-path=.terraform

  - repo: local
    hooks:
      - id: pytest
        name: pytest (non-Spark)
        # Must be the venv interpreter: the job module imports pyspark at import
        # time, so even the non-Spark tests need it. A bare `pytest` resolves to
        # whatever is first on PATH, which will not have it.
        entry: venv/bin/python -m pytest
        language: system
        pass_filenames: false
        types: [python]
        args:
          - -m
          - "not spark"
